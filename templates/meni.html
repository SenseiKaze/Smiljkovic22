{% extends "osnova.html" %}

{% block title %}{{ naslov }} - Smiljko's Spot{% endblock %}

{% block content %}
    <h2>{{ naslov[0] }}</h2>
    <h3>Meni</h3>
    <ul>
        {% for jelo in meni %}
            <li><h3>{{ jelo[0] }}</h3>
            <h4>{{ jelo[1] }}</h4>
            <h4>{{ jelo[2] }}</h4></li>
        {% endfor %}
    </ul>
    <a href="/" class="btn">Početna</a>
    <a href="/restorani" class="btn">Restorani</a>
{% endblock %}
